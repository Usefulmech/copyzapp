<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: allow scale on desktop, respect safe areas on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CopyZap — Phone to PC Ephemeral Bridge</title>
    <meta name="description" content="CopyZap is a local-first, ephemeral bridge between your phone and your PC. Share text, links, or images instantly — they auto-vanish after 24 hours." />

    <!-- PWA Meta -->
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CopyZap" />

    <!-- PWA Manifest (href updated dynamically by JS after /api/tokens/active resolves) -->
    <link rel="manifest" id="pwa-manifest-link" href="/api/manifest/placeholder" />

    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="CopyZap — Phone to PC Bridge" />
    <meta property="og:description" content="Local-first ephemeral clipboard bridge between your phone and PC." />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0B0C] text-[#E0E0E1] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration skipped or failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
